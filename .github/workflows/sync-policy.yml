# sync-check v1
# repo-sync policy check. Installed by workstation/repo-sync/setup.mjs; edit the template, not this copy.
# Runs on pull_request_target, so this file always comes from the BASE branch.
# It NEVER checks out PR code. It reads the PR file list through the API with a read-only token.
# The operator-approved label counts only on the run triggered by adding that label; any later
# push (synchronize) or other label event re-fails a protected-path PR until the operator re-labels.
# Fail-closed: the PR head must not move while the file list is read and must equal the event's
# head sha; the listed file count must reach changed_files (no lost page). Path matching ignores
# case because the fleet's Windows/macOS checkouts do.
name: sync-policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  sync-policy:
    name: sync-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check protected paths
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PROTECTED_JSON: '["timekeeping/",".github/",".sync-check","hooks/","workstation/repo-sync/","master.enc.yaml"]'
        run: |
          set -euo pipefail
          meta='{head: .head.sha, changed_files: .changed_files}'
          gh api "repos/$REPO/pulls/$PR_NUMBER" --jq "$meta" > "$RUNNER_TEMP/before.json"
          gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate \
            --jq '.[] | {f: .filename, p: (.previous_filename // null)} | @json' > "$RUNNER_TEMP/changed.jsonl"
          gh api "repos/$REPO/pulls/$PR_NUMBER" --jq "$meta" > "$RUNNER_TEMP/after.json"
          gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.labels[].name' > "$RUNNER_TEMP/labels.txt"
          node - "$RUNNER_TEMP/changed.jsonl" "$RUNNER_TEMP/labels.txt" "$RUNNER_TEMP/before.json" "$RUNNER_TEMP/after.json" <<'JS'
          const fs = require('fs');
          const [changedFile, labelsFile, beforeFile, afterFile] = process.argv.slice(2);
          const fail = (msg) => {
            console.log('::error::' + msg);
            process.exit(1);
          };
          const readMeta = (f) => {
            try {
              return JSON.parse(fs.readFileSync(f, 'utf8'));
            } catch {
              return null;
            }
          };
          const protectedList = JSON.parse(process.env.PROTECTED_JSON);
          const lines = fs.readFileSync(changedFile, 'utf8').split('\n').filter(Boolean);
          if (lines.length >= 3000) fail('PR lists 3000+ files (API cap); cannot verify protected paths');
          // Fail closed unless the file list provably belongs to this event's head and is complete.
          const before = beforeFile ? readMeta(beforeFile) : null;
          const after = afterFile ? readMeta(afterFile) : null;
          if (!before || !after || typeof after.head !== 'string' || !Number.isInteger(after.changed_files)) {
            fail('PR metadata unavailable; cannot verify protected paths');
          }
          if (before.head !== after.head) fail('PR head moved while the file list was read; the run for the new head decides');
          if (process.env.EVENT_HEAD_SHA !== after.head) fail('PR head is not the head this event was raised for; the run for the current head decides');
          if (lines.length < after.changed_files) {
            fail('file list incomplete (' + lines.length + ' of ' + after.changed_files + '); cannot verify protected paths');
          }
          const paths = [];
          for (const line of lines) {
            const row = JSON.parse(line);
            paths.push(row.f);
            if (row.p) paths.push(row.p);
          }
          const norm = (p) => String(p).replace(/\\/g, '/').replace(/^(\.\/)+/, '').toLowerCase();
          const entries = protectedList.filter((e) => typeof e === 'string' && e.length > 0).map(norm);
          const hits = [];
          for (const raw of paths) {
            const p = norm(raw);
            const base = p.split('/').pop();
            const hit = entries.some((e) => (e.endsWith('/') ? p.startsWith(e) || p === e.slice(0, -1) : p === e || base === e));
            if (hit && !hits.includes(raw)) hits.push(raw);
          }
          const labels = fs.readFileSync(labelsFile, 'utf8').split('\n').map((s) => s.trim()).filter(Boolean);
          const hasLabel = labels.includes('operator-approved');
          const freshApproval = process.env.EVENT_ACTION === 'labeled' && process.env.EVENT_LABEL === 'operator-approved';
          console.log('changed paths: ' + paths.length + '; protected hits: ' + hits.length);
          if (hits.length === 0) {
            console.log('sync-policy: no protected paths touched');
            process.exit(0);
          }
          for (const h of hits) console.log('::error::protected path: ' + h);
          if (hasLabel && freshApproval) {
            console.log('sync-policy: protected paths approved by the operator-approved label on this run');
            process.exit(0);
          }
          if (hasLabel) {
            console.log('::error::operator-approved predates this event (' + process.env.EVENT_ACTION + '); remove and re-add the label to approve the current head');
          } else {
            console.log('::error::protected paths need the operator-approved label (added by the operator)');
          }
          process.exit(1);
          JS
