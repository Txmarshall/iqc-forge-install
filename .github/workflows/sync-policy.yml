# sync-check v1
# repo-sync policy check. Installed by workstation/repo-sync/setup.mjs; edit the template, not this copy.
# Runs on pull_request_target, so this file always comes from the BASE branch.
# It NEVER checks out PR code. It reads the PR file list through the API with a read-only token.
# Base pinning: a PR is only checked against the default branch (pull_request_target runs the
# BASE branch's workflow; a PR retargeted to another branch fails here, and `edited` re-runs it).
# Approval: the operator-approved label passes the run it triggers. Later runs pass only by
# carry-over: H0 = the PR head when the label was added (server push log, issue timeline), H0 must
# be an ancestor of the head, no base change since, and no protected file the PR still changes was
# touched after H0. So "update from main" keeps the approval; a new protected change, a force-push
# or a rebase needs the label again. Every lookup failure means no carry-over.
# Fail-closed: the PR head must not move while the file list is read and must equal the event's
# head sha; the listed file count must reach changed_files (no lost page). Path matching ignores
# case because the fleet's Windows/macOS checkouts do.
name: sync-policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  sync-policy:
    name: sync-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check protected paths
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          OPERATOR_LOGIN: ${{ github.repository_owner }}
          EVENT_SENDER: ${{ github.event.sender.login }}
          EVENT_SENDER_TYPE: ${{ github.event.sender.type }}
          PROTECTED_JSON: '["timekeeping/",".github/",".sync-check","hooks/","master.enc.yaml"]'
        run: |
          set -euo pipefail
          meta='{head: .head.sha, changed_files: .changed_files}'
          gh api "repos/$REPO/pulls/$PR_NUMBER" --jq "$meta" > "$RUNNER_TEMP/before.json"
          gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate \
            --jq '.[] | {f: .filename, p: (.previous_filename // null)} | @json' > "$RUNNER_TEMP/changed.jsonl"
          gh api "repos/$REPO/pulls/$PR_NUMBER" --jq "$meta" > "$RUNNER_TEMP/after.json"
          gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.labels[].name' > "$RUNNER_TEMP/labels.txt"
          node - "$RUNNER_TEMP/changed.jsonl" "$RUNNER_TEMP/labels.txt" "$RUNNER_TEMP/before.json" "$RUNNER_TEMP/after.json" <<'JS'
          const fs = require('fs');
          const [changedFile, labelsFile, beforeFile, afterFile] = process.argv.slice(2);
          const fail = (msg) => {
            console.log('::error::' + msg);
            process.exit(1);
          };
          const readMeta = (f) => {
            try {
              return JSON.parse(fs.readFileSync(f, 'utf8'));
            } catch {
              return null;
            }
          };
          if (!process.env.DEFAULT_BRANCH || process.env.BASE_REF !== process.env.DEFAULT_BRANCH) {
            fail('PR base is "' + process.env.BASE_REF + '", not the default branch "' + process.env.DEFAULT_BRANCH + '"; sync-policy only approves PRs into the default branch');
          }
          const protectedList = JSON.parse(process.env.PROTECTED_JSON);
          const lines = fs.readFileSync(changedFile, 'utf8').split('\n').filter(Boolean);
          if (lines.length >= 3000) fail('PR lists 3000+ files (API cap); cannot verify protected paths');
          // Fail closed unless the file list provably belongs to this event's head and is complete.
          const before = beforeFile ? readMeta(beforeFile) : null;
          const after = afterFile ? readMeta(afterFile) : null;
          if (!before || !after || typeof after.head !== 'string' || !Number.isInteger(after.changed_files)) {
            fail('PR metadata unavailable; cannot verify protected paths');
          }
          if (before.head !== after.head) fail('PR head moved while the file list was read; the run for the new head decides');
          if (process.env.EVENT_HEAD_SHA !== after.head) fail('PR head is not the head this event was raised for; the run for the current head decides');
          if (lines.length < after.changed_files) {
            fail('file list incomplete (' + lines.length + ' of ' + after.changed_files + '); cannot verify protected paths');
          }
          const paths = [];
          for (const line of lines) {
            const row = JSON.parse(line);
            paths.push(row.f);
            if (row.p) paths.push(row.p);
          }
          const norm = (p) => String(p).replace(/\\/g, '/').replace(/^(\.\/)+/, '').toLowerCase();
          const entries = protectedList.filter((e) => typeof e === 'string' && e.length > 0).map(norm);
          const hits = [];
          for (const raw of paths) {
            const p = norm(raw);
            const base = p.split('/').pop();
            const hit = entries.some((e) => (e.endsWith('/') ? p.startsWith(e) || p === e.slice(0, -1) : p === e || base === e));
            if (hit && !hits.includes(raw)) hits.push(raw);
          }
          const labels = fs.readFileSync(labelsFile, 'utf8').split('\n').map((s) => s.trim()).filter(Boolean);
          const hasLabel = labels.includes('operator-approved');
          const freshApproval = process.env.EVENT_ACTION === 'labeled' && process.env.EVENT_LABEL === 'operator-approved'
            && process.env.EVENT_SENDER_TYPE === 'User' && !!process.env.OPERATOR_LOGIN && process.env.EVENT_SENDER === process.env.OPERATOR_LOGIN;
          console.log('changed paths: ' + paths.length + '; protected hits: ' + hits.length);
          if (hits.length === 0) {
            console.log('sync-policy: no protected paths touched');
            process.exit(0);
          }
          for (const h of hits) console.log('::error::protected path: ' + h);
          if (hasLabel && freshApproval) {
            console.log('sync-policy: protected paths approved by the operator-approved label on this run');
            process.exit(0);
          }
          // Carry-over. Returns the approved head H0, or null (fail closed) on any doubt.
          const carryOver = () => {
            try {
              const { execFileSync } = require('child_process');
              const api = (route, paginate) => {
                const args = ['api', route].concat(paginate ? ['--paginate', '--slurp'] : []);
                const raw = execFileSync('gh', args, { encoding: 'utf8', maxBuffer: 64 * 1024 * 1024 }); // gh-runner (tests patch this line)
                const v = JSON.parse(raw);
                return paginate ? [].concat(...v) : v;
              };
              const sha = /^[0-9a-f]{40}$/;
              const head = after.head;
              const headRef = process.env.HEAD_REF || '';
              if (!sha.test(head) || process.env.HEAD_REPO !== process.env.REPO || !/^[A-Za-z0-9._\/-]{1,200}$/.test(headRef)) return null;
              const timeline = api('repos/' + process.env.REPO + '/issues/' + process.env.PR_NUMBER + '/timeline?per_page=100', true);
              const t = (s) => Date.parse(s);
              // Only a label the repo owner added as a human counts: a label added by a workflow's
              // GITHUB_TOKEN (github-actions[bot]) triggers no run of its own and must not approve.
              const byOperator = (e) => e.actor && e.actor.type === 'User' && e.actor.login === process.env.OPERATOR_LOGIN;
              const labeled = timeline.filter((e) => e && e.event === 'labeled' && e.label && e.label.name === 'operator-approved' && byOperator(e) && !isNaN(t(e.created_at)));
              // The latest operator-approved label event of ANY actor must be the operator's.
              const anyLabeled = timeline.filter((e) => e && e.event === 'labeled' && e.label && e.label.name === 'operator-approved' && !isNaN(t(e.created_at)));
              if (!labeled.length || Math.max(...anyLabeled.map((e) => t(e.created_at))) !== Math.max(...labeled.map((e) => t(e.created_at)))) return null;
              if (!labeled.length) return null;
              const labelT = Math.max(...labeled.map((e) => t(e.created_at)));
              if (timeline.some((e) => e && e.event === 'base_ref_changed' && !(t(e.created_at) < labelT))) return null;
              const activity = api('repos/' + process.env.REPO + '/activity?ref=refs/heads/' + headRef + '&per_page=100', true);
              const moves = activity.filter((a) => a && ['push', 'force_push', 'branch_creation'].includes(a.activity_type) && sha.test(a.after || '') && !isNaN(t(a.timestamp)));
              if (moves.some((a) => Math.abs(t(a.timestamp) - labelT) <= 2000)) return null; // within 2 s of the label: ambiguous
              const prior = moves.filter((a) => t(a.timestamp) < labelT).sort((x, y) => t(y.timestamp) - t(x.timestamp));
              if (!prior.length) return null;
              const h0 = prior[0].after;
              if (h0 === head) return h0;
              const cmp = api('repos/' + process.env.REPO + '/compare/' + h0 + '...' + head, false);
              if (!cmp || cmp.status !== 'ahead' || !Array.isArray(cmp.files) || cmp.files.length >= 300) return null;
              const touched = new Set();
              for (const f of cmp.files) {
                if (f && f.filename) touched.add(norm(f.filename));
                if (f && f.previous_filename) touched.add(norm(f.previous_filename));
              }
              if (hits.some((h) => touched.has(norm(h)))) return null;
              // Every protected file the PR changes now must have been in the approved diff at H0
              // (blocks "merge main, then delete or revert a protected file main added").
              const base = api('repos/' + process.env.REPO + '/compare/' + process.env.DEFAULT_BRANCH + '...' + h0, false);
              if (!base || !['ahead', 'diverged'].includes(base.status) || !Array.isArray(base.files) || base.files.length >= 300) return null;
              const approved = new Set();
              for (const f of base.files) {
                if (f && f.filename) approved.add(norm(f.filename));
                if (f && f.previous_filename) approved.add(norm(f.previous_filename));
              }
              if (!hits.every((h) => approved.has(norm(h)))) return null;
              return h0;
            } catch (e) {
              console.log('carry-over lookup failed: ' + String(e && e.message || e).split('\n')[0]);
              return null;
            }
          };
          if (hasLabel) {
            const h0 = carryOver();
            if (h0) {
              console.log('sync-policy: approval carried over from ' + h0 + ' (head when operator-approved was added); no protected file changed since');
              process.exit(0);
            }
            console.log('::error::operator-approved was added at a head this PR has since moved away from (a protected file changed, a force-push/rebase, or a base change); remove and re-add the label to approve the current head');
          } else {
            console.log('::error::protected paths need the operator-approved label (added by the operator)');
          }
          process.exit(1);
          JS
